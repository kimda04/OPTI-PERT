<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Editar Actividad - OPTI-PERT</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark top-navbar">
<div class="container-fluid">
<span class="navbar-brand fw-bold">
OPTI-PERT
</span>
</div>
</nav>


<div class="container mt-5">

<div class="card dashboard-card">

<div class="card-body">

<h3 class="mb-4">
<i class="bi bi-pencil"></i>
Editar Actividad
</h3>


<form method="POST">


<div class="mb-3">

<label class="form-label">
Actividad
</label>

<input
class="form-control"
value="{{ activity.name }}"
disabled>

</div>



<div class="mb-3">

<label class="form-label">
Descripción
</label>

<input
class="form-control"
name="description"
value="{{ activity.description }}">

</div>



<div class="row">


<div class="col">

<label>
Optimista
</label>

<input
type="number"
step="0.01"
class="form-control"
name="optimistic"
value="{{ activity.optimistic }}">

</div>


<div class="col">

<label>
Más probable
</label>

<input
type="number"
step="0.01"
class="form-control"
name="most_likely"
value="{{ activity.most_likely }}">

</div>



<div class="col">

<label>
Pesimista
</label>

<input
type="number"
step="0.01"
class="form-control"
name="pessimistic"
value="{{ activity.pessimistic }}">

</div>


</div>


<div class="mt-3">

<label>
Predecesores
</label>

<input
class="form-control"
name="predecessors"
value="{{ activity.predecessors|join(',') }}">

</div>



<div class="mt-4">

<button class="btn btn-primary">

Guardar cambios

</button>


<a href="/" class="btn btn-secondary">

Volver

</a>

</div>


</form>


</div>

</div>

</div>


</body>
</html>
